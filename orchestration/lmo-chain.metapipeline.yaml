# yaml-language-server: $schema=https://raw.githubusercontent.com/bmds-tue/nf-meta/refs/heads/main/schemas/metapipeline.schema.json
#
# Illustrative nf-meta representation of the LMO chain this project has already run and
# recorded in RUNS.md (fetchngs 01 -> {mag 05 -> proteinfamilies 06} / {metatdenovo 02 ->
# proteinfamilies 03 -> proteinannotator 07}), with the scripts/converters/ samplesheet
# conversions wired in as modules/local/*/main.nf steps instead of a manual "run script,
# then launch the next thing by hand" gap.
#
# The glue steps are plain nf-pipeline entries pointed at this fork with main_script: set to
# the module's own main.nf, NOT nf-meta's nf-module type. `nextflow module run` (what
# type: nf-module shells out to) only resolves modules published to registry.nextflow.io
# ("run a module directly from the registry" per its own --help) -- it rejects an
# org/repo/path reference outright ("Invalid module reference"), confirmed by actually
# running it against this fork. `nextflow run <url> -r <sha> -main-script <path>` is the
# same git-pull mechanism every nf-pipeline step here already uses, and is confirmed
# working end to end against this fork's real pushed commit -- see orchestration/README.md.


config_version: 0.3.0

globals:
  # 26, not 25.10 (nf-meta's own doc example, which this was copied from) -- nf-meta hard-fails
  # on a MAJOR-version mismatch only, and this cluster's real baseline is 26.04+ (AGENTS.md).
  nextflow_version: "26.04"
  # profile: singularity,slurm   # set to whatever this cluster's AGENTS.md profile is

workflows:
  # --- Data retrieval -------------------------------------------------------
  n01_fetchngs:
    name: nf-core/fetchngs
    version: 1.13.0
    params:
      input: runs/01_fetchngs/ids.csv # real accession list already in this repo -- see RUNS.md run 01
      outdir: out/01_fetchngs

  # --- Metagenome (MG) branch: 01 -> glue -> mag -> glue -> proteinfamilies --
  n02_mg_glue:
    from: n01_fetchngs
    name: meta-omics-sig/fetchngs_to_samplesheet
    url: https://github.com/brovolia/meta-omics-sig
    version: "3c377c7d38ac8cd7d5dcb431dee5f3732b4d0b2f"
    main_script: modules/local/fetchngs_to_samplesheet/main.nf
    params:
      fetchngs_samplesheet: ${n01_fetchngs:params:outdir}/samplesheet/samplesheet.csv
      strategy: WGS
      target: mag
      prefix: LMO
      group: "0"
      outdir: out/02_mg_glue

  n03_mag:
    from: n02_mg_glue
    name: nf-core/mag
    version: 5.5.0
    params:
      input: ${n02_mg_glue:params:outdir}/samplesheet.csv
      outdir: out/03_mag

  n04_mg_proteinfamilies_glue:
    from: n03_mag
    name: meta-omics-sig/mag_to_proteinfamilies
    url: https://github.com/brovolia/meta-omics-sig
    version: "3c377c7d38ac8cd7d5dcb431dee5f3732b4d0b2f"
    main_script: modules/local/mag_to_proteinfamilies/main.nf
    params:
      mag_outdir: ${n03_mag:params:outdir}
      sample: LMO_MG_pooled
      assembler: MEGAHIT
      outdir: out/04_mg_proteinfamilies_glue

  n05_proteinfamilies_mg:
    from: n04_mg_proteinfamilies_glue
    name: nf-core/proteinfamilies
    version: 2.5.0
    params:
      input: ${n04_mg_proteinfamilies_glue:params:outdir}/samplesheet.csv
      outdir: out/05_proteinfamilies_mg

  # --- Metatranscriptome (MT) branch: 01 -> glue -> metatdenovo -> glue -> --
  # --- proteinfamilies -> proteinannotator (no glue -- see below) ---------
  n06_mt_glue:
    from: n01_fetchngs
    name: meta-omics-sig/fetchngs_to_samplesheet
    url: https://github.com/brovolia/meta-omics-sig
    version: "3c377c7d38ac8cd7d5dcb431dee5f3732b4d0b2f"
    main_script: modules/local/fetchngs_to_samplesheet/main.nf
    params:
      fetchngs_samplesheet: ${n01_fetchngs:params:outdir}/samplesheet/samplesheet.csv
      strategy: RNA-Seq
      target: reads
      prefix: LMO
      outdir: out/06_mt_glue

  n07_metatdenovo:
    from: n06_mt_glue
    name: nf-core/metatdenovo
    version: 1.4.0
    params:
      input: ${n06_mt_glue:params:outdir}/samplesheet.csv
      outdir: out/07_metatdenovo

  n08_mt_proteinfamilies_glue:
    from: n07_metatdenovo
    name: meta-omics-sig/metatdenovo_to_proteinfamilies
    url: https://github.com/brovolia/meta-omics-sig
    version: "3c377c7d38ac8cd7d5dcb431dee5f3732b4d0b2f"
    main_script: modules/local/metatdenovo_to_proteinfamilies/main.nf
    params:
      metatdenovo_outdir: ${n07_metatdenovo:params:outdir}
      sample: LMO_MT_coassembly
      outdir: out/08_mt_proteinfamilies_glue

  n09_proteinfamilies_mt:
    from: n08_mt_proteinfamilies_glue
    name: nf-core/proteinfamilies
    version: 2.5.0
    params:
      input: ${n08_mt_proteinfamilies_glue:params:outdir}/samplesheet.csv
      outdir: out/09_proteinfamilies_mt
      # Emits proteinannotator/samplesheet.csv for n10 below -- RUNS.md's one edge with no
      # converter at all (run 07): proteinfamilies' own sheet is proteinannotator's input
      # unmodified, as long as n09's outdir isn't moved before n10 runs.
      skip_proteinannotator_samplesheet: false

  n10_proteinannotator:
    from: n09_proteinfamilies_mt
    name: nf-core/proteinannotator
    version: 1.1.0
    params:
      input: ${n09_proteinfamilies_mt:params:outdir}/proteinannotator/samplesheet.csv
      outdir: out/10_proteinannotator
